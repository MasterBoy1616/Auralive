workflows:
  ios-build-testflight:
    name: iOS Build & TestFlight
    instance_type: mac_mini_m1
    max_build_duration: 120
    scripts:
      - name: Install dependencies
        script: |
          yarn install  # veya npm install, projene göre değiştir
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/Aura.xcworkspace" \  # workspace adı projene göre değişebilir (Aura.xcworkspace veya Runner.xcworkspace)
            --scheme "Aura" \  # scheme adı projendeki scheme (Aura veya Runner)
            --configuration Release \
            --export-method app-store
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        apple_id: $APPLE_ID  # App Store Connect email
        team_id: $TEAM_ID  # Apple Developer hesabındaki Team ID
        api_key_id: $APP_STORE_CONNECT_API_KEY_ID
        api_key_issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        api_private_key: $APP_STORE_CONNECT_PRIVATE_KEY
      email:
        recipients:
          - your@email.com  # TestFlight bildirimleri için kendi emailini ekle
